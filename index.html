<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivero App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div id="app" class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="bg-emerald-700 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🌱 Control de Vivero</h1>
      <div class="flex items-center gap-2">
        <input id="pin-input" type="password" placeholder="PIN" class="px-3 py-1 rounded text-slate-800 text-sm w-20 bg-emerald-50 border border-emerald-300 focus:outline-none" />
        <button onclick="toggleCostos()" class="bg-emerald-800 hover:bg-emerald-900 px-3 py-1 rounded text-sm transition">Ver Costos</button>
      </div>
    </header>

    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4">
      <input id="search-text" type="text" oninput="filtrar()" placeholder="Buscar por nombre..." class="flex-1 border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      <select id="search-cat" onchange="filtrar()" class="border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <option value="">Todas las categorías</option>
        <option value="Plantas">Plantas</option>
        <option value="Macetas">Macetas</option>
        <option value="Fertilizantes">Fertilizantes</option>
        <option value="Tierras">Tierras</option>
        <option value="Herramientas">Herramientas</option>
      </select>
    </div>

    <div id="lista" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    let verCostos = false;
    const PIN_CORRECTO = "7714";

    const productos = [
      { id: 1, nombre: "Tierra Preparada 10L", categoria: "Tierras", precio: 2500, costo: 1200, foto: "https://via.placeholder.com/150" },
      { id: 2, nombre: "Substrato Universal", categoria: "Tierras", precio: 3800, costo: 1900, foto: "https://via.placeholder.com/150" },
      { id: 3, nombre: "Monstera Deliciosa", categoria: "Plantas", precio: 8500, costo: 4000, foto: "https://via.placeholder.com/150" }
    ];

    function renderProductos(items) {
      const contenedor = document.getElementById("lista");
      contenedor.innerHTML = "";

      items.forEach(p => {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-4 items-center";
        card.innerHTML = `
          <img src="${p.foto}" alt="${p.nombre}" class="w-20 h-20 object-cover rounded-lg bg-slate-100" />
          <div class="flex-1">
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">${p.categoria}</span>
            <h3 class="font-bold text-lg text-slate-800 mt-1">${p.nombre}</h3>
            <p class="text-emerald-600 font-bold text-base">$${p.precio}</p>
            ${verCostos ? `<p class="text-xs text-rose-500 font-medium mt-1">Costo: $${p.costo}</p>` : ""}
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    function toggleCostos() {
      const pin = document.getElementById("pin-input").value;
      if (verCostos) {
        verCostos = false;
        document.getElementById("pin-input").value = "";
        renderProductos(productos);
      } else if (pin === PIN_CORRECTO) {
        verCostos = true;
        renderProductos(productos);
      } else {
        alert("PIN incorrecto");
      }
    }

    function filtrar() {
      const texto = document.getElementById("search-text").value.toLowerCase();
      const cat = document.getElementById("search-cat").value;

      const filtrados = productos.filter(p => {
        const coincideTexto = p.nombre.toLowerCase().includes(texto);
        const coincideCat = cat === "" || p.categoria === cat;
        return coincideTexto && coincideCat;
      });

      renderProductos(filtrados);
    }

    renderProductos(productos);
  </script>
</body>
</html>
