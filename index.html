<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obras - Asistente IA</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 120px; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        #resultado { margin-top: 20px; white-space: pre-wrap; background: #f8fafc; padding: 15px; border-radius: 4px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Asistente de Obras</h2>
    <p>Escribe una consulta sobre presupuestos, contratos o seguimiento de proyectos:</p>
    
    <textarea id="promptInput" placeholder="Ej: Redactar un reporte de avance de obra..."></textarea>
    <br>
    <button onclick="consultarGemini()">Consultar IA</button>
    
    <div id="resultado"></div>
</div>

<script>
    async function consultarGemini() {
        const promptText = document.getElementById('promptInput').value;
        const resultadoDiv = document.getElementById('resultado');
        
        if (!promptText.trim()) {
            resultadoDiv.innerText = "Por favor, escribe una consulta.";
            return;
        }

        resultadoDiv.innerText = "Procesando solicitud...";

        // Reemplaza 'TU_API_KEY' con tu clave de Google AI Studio
        const apiKey = "TU_API_KEY"; 
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

        try {
            const respuesta = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const datos = await respuesta.json();

            if (datos.candidates && datos.candidates.length > 0) {
                const textoGenerado = datos.candidates[0].content.parts[0].text;
                resultadoDiv.innerText = textoGenerado;
            } else {
                resultadoDiv.innerText = "Respuesta inesperada de la API: " + JSON.stringify(datos);
            }
        } catch (error) {
            resultadoDiv.innerText = "Error de conexión: " + error.message;
        }
    }
</script>

</body>
</html>
