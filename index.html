<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViveroApp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Excel Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="bg-emerald-700 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-leaf text-2xl text-emerald-300"></i>
                <h1 class="text-xl font-bold tracking-wide">ViveroApp</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleCosts()" class="px-3 py-1.5 bg-emerald-800 hover:bg-emerald-900 text-xs rounded-xl flex items-center gap-1.5 border border-emerald-600 transition">
                    <i id="iconPin" class="fa-solid fa-lock"></i> <span id="labelPin">Ver Costos</span>
                </button>
                <button onclick="openExcelModal()" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-xs rounded-xl font-semibold flex items-center gap-1.5 shadow transition">
                    <i class="fa-solid fa-file-excel"></i> Excel
                </button>
            </div>
        </div>

        <nav class="bg-emerald-800 border-t border-emerald-600/50 overflow-x-auto">
            <div class="max-w-7xl mx-auto px-4 flex gap-1 text-xs font-semibold">
                <button onclick="switchTab('plants')" id="tab-plants" class="tab-btn px-4 py-2.5 border-b-2 border-amber-400 text-amber-300">🌱 Plantas</button>
                <button onclick="switchTab('pots')" id="tab-pots" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-emerald-100">🪴 Macetas</button>
                <button onclick="switchTab('tierras')" id="tab-tierras" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-emerald-100">🪵 Tierras</button>
                <button onclick="switchTab('accessories')" id="tab-accessories" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-emerald-100">🛠️ Accesorios</button>
                <button onclick="switchTab('chemicals')" id="tab-chemicals" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-emerald-100">🧪 Químicos</button>
                <button onclick="switchTab('bot')" id="tab-bot" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-emerald-100">🤖 Bot Experto</button>
                <button onclick="switchTab('sales')" id="tab-sales" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-emerald-100">💰 Ventas & Caja</button>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-1">
        <div id="searchContainer" class="mb-6">
            <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="Buscar ítem por nombre..." class="w-full pl-4 pr-4 py-2.5 bg-white rounded-2xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

        <!-- SECCIÓN BOT EXPERTO -->
        <div id="botSection" class="hidden max-w-2xl mx-auto bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
            <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i class="fa-solid fa-robot text-emerald-600"></i> Consulta Botánica</h2>
            <textarea id="botPrompt" rows="3" placeholder="Haz tu consulta sobre cuidados o plagas..." class="w-full p-3 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            <button onclick="askBot()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl transition">Consultar Bot</button>
            <div id="botResponse" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm text-slate-700 hidden"></div>
        </div>

        <!-- SECCIÓN VENTAS & CAJA -->
        <div id="salesSection" class="hidden bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
            <h2 class="font-bold text-slate-800 text-lg mb-2 flex items-center gap-2"><i class="fa-solid fa-receipt text-emerald-600"></i> Registro de Ventas</h2>
            <p class="text-sm text-slate-500">Módulo de registro diario activo.</p>
        </div>
    </main>

    <!-- LIGHTBOX VISOR DE IMÁGENES -->
    <div id="lightboxModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <img id="lightboxImg" src="" class="max-h-[85vh] max-w-[90vw] object-contain rounded-2xl shadow-2xl">
    </div>

    <!-- ELIMINACIÓN CON TEMPORIZADOR DE SEGURIDAD (3 SEGUNDOS) -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-4xl"></i>
            <h3 class="font-bold text-slate-800 text-base">¿Eliminar registro?</h3>
            <p class="text-xs text-slate-500 leading-relaxed">Esta acción borrará el ítem de la base de datos local y de Firestore.</p>
            <div class="flex justify-center gap-3 pt-2">
                <button onclick="cancelDelete()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cancelar</button>
                <button id="confirmDeleteBtn" disabled onclick="executeDelete()" class="px-4 py-2 bg-rose-500 text-white text-xs font-semibold rounded-xl transition opacity-50 cursor-not-allowed">
                    Confirmar (<span id="deleteTimer">3</span>s)
                </button>
            </div>
        </div>
    </div>

    <!-- EXCEL MODAL SIMPLE -->
    <div id="excelModal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-file-excel text-sky-600"></i> Importar Excel</h3>
                <button onclick="closeExcelModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Categoría:</label>
                <select id="excelCategorySelect" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                    <option value="plants">🌱 Plantas</option>
                    <option value="pots">🪴 Macetas</option>
                    <option value="tierras">🪵 Tierras</option>
                    <option value="accessories">🛠️ Accesorios</option>
                    <option value="chemicals">🧪 Químicos</option>
                </select>
            </div>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)" class="text-xs text-slate-600 w-full">
            <div class="flex justify-end pt-2">
                <button onclick="closeExcelModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script>
        // FIREBASE FIRESTORE (Credenciales: viveromorlina)
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "viveromorlina.firebaseapp.com",
            projectId: "viveromorlina",
            storageBucket: "viveromorlina.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentTab = 'plants';
        let showCosts = false;
        const PIN_COSTS = '7714';
        let pendingDeleteId = null;
        let deleteInterval = null;

        let dbData = { plants: [], pots: [], tierras: [], accessories: [], chemicals: [] };

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalDb();
            syncWithFirestore();
            renderCurrentTab();
        });

        function saveDb() {
            localStorage.setItem('vivero_db_data', JSON.stringify(dbData));
            renderCurrentTab();
            db.collection('catalogo').doc('viveromorlina_data').set(dbData).catch(e => console.log('Sync Error:', e));
        }

        function loadLocalDb() {
            const saved = localStorage.getItem('vivero_db_data');
            if (saved) { try { dbData = JSON.parse(saved); } catch(e){} }
        }

        function syncWithFirestore() {
            db.collection('catalogo').doc('viveromorlina_data').onSnapshot(doc => {
                if (doc.exists) {
                    dbData = doc.data();
                    localStorage.setItem('vivero_db_data', JSON.stringify(dbData));
                    renderCurrentTab();
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-amber-400', 'text-amber-300');
                btn.classList.add('border-transparent', 'text-emerald-100');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-emerald-100');
                activeBtn.classList.add('border-amber-400', 'text-amber-300');
            }

            document.getElementById('catalogGrid').classList.toggle('hidden', tab === 'bot' || tab === 'sales');
            document.getElementById('searchContainer').classList.toggle('hidden', tab === 'bot' || tab === 'sales');
            document.getElementById('botSection').classList.toggle('hidden', tab !== 'bot');
            document.getElementById('salesSection').classList.toggle('hidden', tab !== 'sales');

            if (tab !== 'bot' && tab !== 'sales') renderCurrentTab();
        }

        function toggleCosts() {
            if (!showCosts) {
                const pin = prompt('Ingrese PIN (7714):');
                if (pin === PIN_COSTS) {
                    showCosts = true;
                    document.getElementById('iconPin').className = 'fa-solid fa-lock-open';
                    document.getElementById('labelPin').innerText = 'Ocultar Costos';
                    renderCurrentTab();
                } else if (pin !== null) alert('PIN incorrecto');
            } else {
                showCosts = false;
                document.getElementById('iconPin').className = 'fa-solid fa-lock';
                document.getElementById('labelPin').innerText = 'Ver Costos';
                renderCurrentTab();
            }
        }

        function renderCurrentTab() {
            const grid = document.getElementById('catalogGrid');
            if (!grid || currentTab === 'bot' || currentTab === 'sales') return;

            const items = dbData[currentTab] || [];
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No hay productos en esta sección.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col hover:shadow-md transition">
                    <img src="${item.image || 'https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400'}" 
                         onclick="openLightbox('${item.image}')" class="h-40 w-full object-cover cursor-pointer">
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm">${item.name}</h4>
                            ${item.family ? `<p class="text-xs text-emerald-600 font-medium">${item.family}</p>` : ''}
                        </div>
                        <div class="border-t border-slate-100 pt-2 flex justify-between items-center">
                            <div>
                                ${showCosts ? `<p class="text-[10px] text-slate-400">Costo: $${item.buyPrice}</p>` : ''}
                                <p class="text-sm font-extrabold text-slate-800">$${item.sellPrice}</p>
                            </div>
                            <button onclick="startDelete('${item.id}')" class="text-slate-300 hover:text-rose-500 text-xs transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // LIGHTBOX
        function openLightbox(src) {
            if (!src) return;
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }
        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        // ELIMINACIÓN CON CONTADOR 3 SEGUNDOS
        function startDelete(id) {
            pendingDeleteId = id;
            let count = 3;
            const timerSpan = document.getElementById('deleteTimer');
            const confirmBtn = document.getElementById('confirmDeleteBtn');
            timerSpan.innerText = count;
            confirmBtn.disabled = true;
            confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');

            document.getElementById('deleteModal').classList.remove('hidden');

            clearInterval(deleteInterval);
            deleteInterval = setInterval(() => {
                count--;
                timerSpan.innerText = count;
                if (count <= 0) {
                    clearInterval(deleteInterval);
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        function cancelDelete() {
            clearInterval(deleteInterval);
            pendingDeleteId = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function executeDelete() {
            if (!pendingDeleteId) return;
            dbData[currentTab] = dbData[currentTab].filter(i => i.id !== pendingDeleteId);
            saveDb();
            cancelDelete();
        }

        // IMPORTAR DESDE EXCEL
        function openExcelModal() { document.getElementById('excelModal').classList.remove('hidden'); }
        function closeExcelModal() { document.getElementById('excelModal').classList.add('hidden'); }

        function handleExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const targetCat = document.getElementById('excelCategorySelect').value;

            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    
                    json.forEach(row => {
                        const name = row.Nombre || row.nombre || row.NAME;
                        if (!name) return;
                        const buy = parseFloat(row.PrecioCompra || row.precio || 0);
                        const sell = parseFloat(row.PrecioVenta || 0) || (buy * 2);

                        if (!dbData[targetCat]) dbData[targetCat] = [];
                        dbData[targetCat].push({
                            id: 'ex_' + Date.now() + Math.random().toString(36).substr(2, 4),
                            name: String(name),
                            buyPrice: buy,
                            sellPrice: sell,
                            image: row.Imagen || ''
                        });
                    });
                    saveDb();
                    closeExcelModal();
                    switchTab(targetCat);
                    alert('¡Carga completada!');
                } catch(err) {
                    alert('Error al leer el archivo Excel.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function filterItems() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#catalogGrid > div').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? '' : 'none';
            });
        }

        async function askBot() {
            const prompt = document.getElementById('botPrompt').value;
            const resContainer = document.getElementById('botResponse');
            if (!prompt.trim()) return;
            resContainer.classList.remove('hidden');
            resContainer.innerText = 'Consultando...';
        }
    </script>
</body>
</html>
