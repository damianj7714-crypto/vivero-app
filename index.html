<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViveroApp - Gestión Profesional de Viveros</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel handling -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-full flex flex-col selection:bg-emerald-500 selection:text-white">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-lg shadow-md shadow-emerald-200">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg leading-tight">ViveroApp</h1>
                    <p class="text-xs text-emerald-600 font-medium">Gestión Profesional</p>
                </div>
            </div>

            <!-- TOGGLE PRECIO COMPRA & FIREBASE BUTTONS -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                    <span class="text-xs font-semibold text-slate-600 hidden md:inline">Ocultar Costos</span>
                    <button id="toggleBuyPriceBtn" onclick="requestToggleBuyPrice()" class="w-11 h-6 bg-slate-300 rounded-full p-1 transition-colors duration-200 ease-in-out relative flex items-center">
                        <div id="toggleBuyPriceCircle" class="w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-200 ease-in-out translate-x-0"></div>
                    </button>
                </div>

                <button onclick="openFirebaseModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-semibold rounded-lg transition">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span class="hidden sm:inline">Firebase</span>
                </button>
            </div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="bg-white border-b border-slate-200 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto space-x-2 sm:space-x-6 py-2">
            <button onclick="switchTab('plants')" id="tab-plants" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-emerald-600 text-white shadow-sm shadow-emerald-200 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-leaf"></i> Plantas
            </button>
            <button onclick="switchTab('pots')" id="tab-pots" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-600 hover:bg-slate-100 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-circle"></i> Macetas
            </button>
            <button onclick="switchTab('accessories')" id="tab-accessories" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-600 hover:bg-slate-100 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-tools"></i> Accesorios
            </button>
            <button onclick="switchTab('chemicals')" id="tab-chemicals" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-600 hover:bg-slate-100 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-flask"></i> Químicos
            </button>
            <button onclick="switchTab('soils')" id="tab-soils" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-600 hover:bg-slate-100 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-jar"></i> Tierras
            </button>
            <button onclick="switchTab('sales')" id="tab-sales" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-600 hover:bg-slate-100 flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-cash-register"></i> Ventas
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

        <!-- PLANTS TAB -->
        <section id="section-plants" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Catálogo de Plantas</h2>
                </div>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <button onclick="openExcelModal('plants')" class="px-4 py-2.5 bg-sky-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-file-excel"></i> Importar Excel</button>
                    <button onclick="openPlantModal()" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-plus"></i> Nueva Planta</button>
                </div>
            </div>
            <div id="plantsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <!-- POTS TAB -->
        <section id="section-pots" class="space-y-6 hidden">
            <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold text-slate-900">Macetas</h2>
                <div class="flex gap-2">
                    <button onclick="openExcelModal('pots')" class="px-4 py-2.5 bg-sky-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-file-excel"></i> Importar Excel</button>
                    <button onclick="openItemModal('pots')" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-plus"></i> Nueva Maceta</button>
                </div>
            </div>
            <div id="potsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <!-- ACCESSORIES TAB -->
        <section id="section-accessories" class="space-y-6 hidden">
            <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold text-slate-900">Accesorios</h2>
                <div class="flex gap-2">
                    <button onclick="openExcelModal('accessories')" class="px-4 py-2.5 bg-sky-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-file-excel"></i> Importar Excel</button>
                    <button onclick="openItemModal('accessories')" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-plus"></i> Nuevo Accesorio</button>
                </div>
            </div>
            <div id="accessoriesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <!-- CHEMICALS TAB -->
        <section id="section-chemicals" class="space-y-6 hidden">
            <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold text-slate-900">Químicos y Fertilizantes</h2>
                <div class="flex gap-2">
                    <button onclick="openExcelModal('chemicals')" class="px-4 py-2.5 bg-sky-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-file-excel"></i> Importar Excel</button>
                    <button onclick="openChemicalModal()" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-plus"></i> Nuevo Químico</button>
                </div>
            </div>
            <div id="chemicalsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <!-- SOILS TAB (NUEVA CATEGORÍA) -->
        <section id="section-soils" class="space-y-6 hidden">
            <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold text-slate-900">Tierras y Sustratos</h2>
                <div class="flex gap-2">
                    <button onclick="openExcelModal('soils')" class="px-4 py-2.5 bg-sky-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-file-excel"></i> Importar Excel</button>
                    <button onclick="openSoilModal()" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-plus"></i> Nueva Tierra</button>
                </div>
            </div>
            <div id="soilsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>

        <!-- SALES TAB -->
        <section id="section-sales" class="space-y-6 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-900">Ventas</h2>
                <button onclick="openSaleModal()" class="px-4 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-xl"><i class="fa-solid fa-cash-register"></i> Registrar Venta</button>
            </div>
            <div id="salesTableBody"></div>
        </section>

    </main>

    <!-- MODAL SOILS (TIERRAS) -->
    <div id="soilModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-900 text-lg">Guardar Tierra / Sustrato</h3>
            <form onsubmit="saveSoil(event)" class="space-y-3">
                <input type="hidden" id="soilEditId">
                <input type="text" id="soilName" placeholder="Nombre" required class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="text" id="soilBrand" placeholder="Marca" class="w-full px-3 py-2 border rounded-xl text-sm">
                <select id="soilType" class="w-full px-3 py-2 border rounded-xl text-sm">
                    <option value="Tierra Preparada">Tierra Preparada / Sustrato Universal</option>
                    <option value="Compost">Compost Orgánico / Humus de Lombriz</option>
                    <option value="Suculentas">Sustrato para Suculentas y Cactus</option>
                    <option value="Plantas con Flor">Sustrato para Plantas con Flor</option>
                    <option value="Drenaje">Componentes de Drenaje (Perlita, Turba)</option>
                </select>
                <input type="text" id="soilMeasure" placeholder="Medida (ej: 10L, 25kg)" class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="number" id="soilBuyPrice" placeholder="Precio Compra ($)" required class="w-full px-3 py-2 border rounded-xl text-sm">
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeSoilModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL CHEMICALS (QUÍMICOS) -->
    <div id="chemicalModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-slate-900 text-lg">Guardar Químico</h3>
            <form onsubmit="saveChemical(event)" class="space-y-3">
                <input type="hidden" id="chemicalEditId">
                <input type="text" id="chemicalName" placeholder="Nombre" required class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="text" id="chemicalType" placeholder="Tipo (ej: Fertilizante, Insecticida)" class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="text" id="chemicalApplication" placeholder="Aplicación (ej: Foliar, Riego)" class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="text" id="chemicalDilution" placeholder="Disolución (ej: 5ml por Litro)" class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="text" id="chemicalMeasure" placeholder="Medida (ej: 250cc, 1L)" class="w-full px-3 py-2 border rounded-xl text-sm">
                <input type="number" id="chemicalBuyPrice" placeholder="Precio Compra ($)" required class="w-full px-3 py-2 border rounded-xl text-sm">
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeChemicalModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let hideBuyPrice = false;
        let dbData = {
            plants: [],
            pots: [],
            accessories: [],
            chemicals: [],
            soils: [],
            sales: []
        };

        function formatMoney(val) {
            return '$ ' + (Number(val) || 0).toLocaleString('es-AR');
        }

        function requestToggleBuyPrice() {
            const password = prompt("Ingresa la contraseña para cambiar la visibilidad de costos:");
            if (password === "7714") {
                hideBuyPrice = !hideBuyPrice;
                const btn = document.getElementById('toggleBuyPriceBtn');
                const circle = document.getElementById('toggleBuyPriceCircle');
                btn.className = hideBuyPrice ? "w-11 h-6 bg-emerald-600 rounded-full p-1 transition-colors relative flex items-center" : "w-11 h-6 bg-slate-300 rounded-full p-1 transition-colors relative flex items-center";
                circle.className = hideBuyPrice ? "w-4 h-4 bg-white rounded-full shadow-md transform translate-x-5 transition-transform" : "w-4 h-4 bg-white rounded-full shadow-md transform translate-x-0 transition-transform";
                renderCurrentTab();
            } else if (password !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('main > section').forEach(el => el.classList.add('hidden'));
            document.getElementById('section-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.replace('bg-emerald-600', 'text-slate-600'));
            document.getElementById('tab-' + tabId).classList.add('bg-emerald-600', 'text-white');
            renderCurrentTab();
        }

        function renderCurrentTab() {
            renderSoils();
            renderChemicals();
        }

        // --- TIERRAS ---
        function openSoilModal() { document.getElementById('soilModal').classList.remove('hidden'); }
        function closeSoilModal() { document.getElementById('soilModal').classList.add('hidden'); }

        function saveSoil(e) {
            e.preventDefault();
            const buyPrice = parseFloat(document.getElementById('soilBuyPrice').value) || 0;
            const item = {
                id: 's_' + Date.now(),
                name: document.getElementById('soilName').value,
                brand: document.getElementById('soilBrand').value,
                type: document.getElementById('soilType').value,
                measure: document.getElementById('soilMeasure').value,
                buyPrice: buyPrice,
                sellPrice: buyPrice * 2
            };
            dbData.soils.push(item);
            closeSoilModal();
            renderSoils();
        }

        function renderSoils() {
            const grid = document.getElementById('soilsGrid');
            if (!grid) return;
            grid.innerHTML = dbData.soils.map(item => `
                <div class="bg-white p-4 rounded-2xl border shadow-xs space-y-2">
                    <span class="text-xs font-semibold text-emerald-600">${item.brand || 'Sin Marca'} • ${item.type}</span>
                    <h3 class="font-bold text-slate-900">${item.name}</h3>
                    <p class="text-xs text-slate-500">Medida: ${item.measure || 'N/A'}</p>
                    <div class="bg-slate-50 p-2 rounded-xl flex justify-between items-center text-xs">
                        ${hideBuyPrice ? '' : `<span>Compra: <b>${formatMoney(item.buyPrice)}</b></span>`}
                        <span class="text-emerald-700 font-bold">Venta: ${formatMoney(item.sellPrice)}</span>
                    </div>
                </div>
            `).join('');
        }

        // --- QUÍMICOS ---
        function openChemicalModal() { document.getElementById('chemicalModal').classList.remove('hidden'); }
        function closeChemicalModal() { document.getElementById('chemicalModal').classList.add('hidden'); }

        function saveChemical(e) {
            e.preventDefault();
            const buyPrice = parseFloat(document.getElementById('chemicalBuyPrice').value) || 0;
            const item = {
                id: 'c_' + Date.now(),
                name: document.getElementById('chemicalName').value,
                type: document.getElementById('chemicalType').value,
                application: document.getElementById('chemicalApplication').value,
                dilution: document.getElementById('chemicalDilution').value,
                measure: document.getElementById('chemicalMeasure').value,
                buyPrice: buyPrice,
                sellPrice: buyPrice * 2
            };
            dbData.chemicals.push(item);
            closeChemicalModal();
            renderChemicals();
        }

        function renderChemicals() {
            const grid = document.getElementById('chemicalsGrid');
            if (!grid) return;
            grid.innerHTML = dbData.chemicals.map(item => `
                <div class="bg-white p-4 rounded-2xl border shadow-xs space-y-2">
                    <span class="text-xs font-semibold text-emerald-600">${item.type || 'Químico'}</span>
                    <h3 class="font-bold text-slate-900">${item.name}</h3>
                    <p class="text-xs text-slate-500">Aplicación: ${item.application || 'N/A'} | Disolución: ${item.dilution || 'N/A'}</p>
                    <p class="text-xs text-slate-500">Medida: ${item.measure || 'N/A'}</p>
                    <div class="bg-slate-50 p-2 rounded-xl flex justify-between items-center text-xs">
                        ${hideBuyPrice ? '' : `<span>Compra: <b>${formatMoney(item.buyPrice)}</b></span>`}
                        <span class="text-emerald-700 font-bold">Venta: ${formatMoney(item.sellPrice)}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
