<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga Masiva de Stock</title>
    <!-- Librería SheetJS para leer archivos Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100">

    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Carga Masiva de Stock</h2>
        
        <!-- Selector de Categoría -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Sección / Categoría:</label>
            <select id="categorySelect" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-green-500">
                <option value="macetas">Macetas</option>
                <option value="sustratos">Sustratos / Tierras</option>
                <option value="quimicos">Químicos / Fertilizantes</option>
                <option value="accesorios">Accesorios</option>
            </select>
        </div>

        <!-- Selector de Archivo -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Archivo Excel (.xlsx o .csv):</label>
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" 
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
        </div>

        <!-- Botón de Ejecución -->
        <button onclick="handleExcelUpload()" class="w-full bg-green-600 text-white font-semibold py-2 px-4 rounded hover:bg-green-700 transition">
            Procesar y Sincronizar con Firebase
        </button>

        <!-- Mensajes de Estado -->
        <p id="statusMessage" class="mt-4 text-sm font-medium text-gray-700"></p>
    </div>

    <!-- Lógica JavaScript y conexión a Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu proyecto en Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función global accesible desde el botón HTML
        window.handleExcelUpload = async function() {
            const fileInput = document.getElementById('fileInput');
            const categorySelect = document.getElementById('categorySelect');
            const statusMessage = document.getElementById('statusMessage');

            const file = fileInput.files[0];
            if (!file) {
                statusMessage.textContent = "Por favor selecciona un archivo Excel primero.";
                statusMessage.className = "mt-4 text-sm font-medium text-red-600";
                return;
            }

            const category = categorySelect.value;
            statusMessage.textContent = "Leyendo archivo Excel...";
            statusMessage.className = "mt-4 text-sm font-medium text-blue-600";

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet);

                    if (rows.length === 0) {
                        statusMessage.textContent = "El archivo Excel está vacío.";
                        statusMessage.className = "mt-4 text-sm font-medium text-red-600";
                        return;
                    }

                    statusMessage.textContent = `Subiendo ${rows.length} registros a la categoría "${category}"...`;

                    const collectionRef = collection(db, 'inventory');

                    for (let row of rows) {
                        const costo = parseFloat(row.Costo || row.costo || 0);
                        const precioVenta = costo * 2; // Regla general de duplicar costo

                        const itemData = {
                            sku: String(row.SKU || row.sku || ''),
                            nombre: row.Nombre || row.nombre || 'Sin nombre',
                            costo: costo,
                            precio: precioVenta,
                            stock: parseInt(row.Stock || row.stock || 0, 10),
                            categoria: category,
                            createdAt: serverTimestamp()
                        };

                        await addDoc(collectionRef, itemData);
                    }

                    statusMessage.textContent = `¡Carga exitosa! Se importaron ${rows.length} registros correctamente.`;
                    statusMessage.className = "mt-4 text-sm font-medium text-green-600";
                    fileInput.value = ""; // Limpiar input

                } catch (error) {
                    console.error("Error detallado:", error);
                    statusMessage.textContent = "Hubo un error al procesar el archivo o conectar con Firebase.";
                    statusMessage.className = "mt-4 text-sm font-medium text-red-600";
                }
            };

            reader.readAsArrayBuffer(file);
        };
    </script>
</body>
</html>
